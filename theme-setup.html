<p class="eyebrow">SERVER APPEARANCE SETUP</p><h1>Q 版帳號頁外觀安裝</h1>
<p class="form-intro">請在 192.168.0.130 的 Windows Server 虛擬機下載並執行。</p>
<a class="setup-download" href="downloads/EP12-ChibiTheme.zip?v=1" download="EP12-ChibiTheme.zip">下載 ZIP 安裝包 ↓</a>
<ol><li>下載後，將 ZIP 解壓縮到虛擬機桌面。</li><li>雙擊 <code>Install-EP12-ChibiTheme.cmd</code>。</li><li>Windows 顯示管理員提示時，按「是」。</li><li>看到 <code>EP12 CHIBI THEME READY</code> 即完成。</li></ol>
<p>這個安裝步驟不需要輸入 SQL 密碼。</p>
